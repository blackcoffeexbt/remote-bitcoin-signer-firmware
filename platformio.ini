[platformio]
default_envs = esp32-s3-n16r8v

[bitcoin]
# 0 = Mainnet (default), 1 = Testnet4. Fixed for the entire firmware build.
testnet4 = 1

[env:esp32-s3-n16r8v]
platform = platformio/espressif32@6.12.0
framework = arduino
board = esp32-s3-n16r8v
monitor_speed = 115200
board_build.embed_files = data/cert/roots.bin
upload_speed = 921600
upload_protocol = custom
upload_command = "$PYTHONEXE" "$PROJECT_DIR/scripts/flash_app.py" "$SOURCE" --port "$UPLOAD_PORT" --baud "$UPLOAD_SPEED" --esptool "$SAFE_ESPTOOL"
extra_scripts = post:scripts/safe_upload.py
build_unflags = -std=gnu++11 -fno-exceptions
build_flags =
  -std=gnu++17
  -fexceptions
  -DBITCOIN_TESTNET4=${bitcoin.testnet4}
  -DLV_CONF_PATH="${PROJECT_DIR}/src/lv_conf.h"
lib_deps =
  moononournation/GFX Library for Arduino@1.4.7
  lvgl/lvgl@8.4.0
  https://github.com/micro-bitcoin/uBitcoin.git#877542fdc16319dd92a7d2a679ea9dacce474bd2
  bblanchon/ArduinoJson@6.21.5
  cafxx/gmp-ino@0.1.0

[env:selftest]
extends = env:esp32-s3-n16r8v
build_flags = ${env:esp32-s3-n16r8v.build_flags} -DBITCOIN_SELF_TEST
